<div class="file-tree-panel">
  <abp-tree class="mb-2" [class.directory-dragging]="isDirectoryDragging" [nodes]="fileGroupList" (nzExpandChange)="nzExpandChange($event)" [draggable]="true"
    [beforeDrop]="beforeDrop" (selectedNodeChange)="activeNode($event)"
    [changeCheckboxWithNode]="true" [isNodeSelected]="isNodeSelected"
    (contextmenu)="$event.preventDefault()">

    <ng-template #menu let-node>
      <button type="button" class="dropdown-item" (click.stop)="addDescriptorBtn(node)"><i
        class="me-1 fa fa-plus"></i>{{'FileExplorer::NewDirectory' | abpLocalization}}</button>
      @if (!isMyFilesNode(node)) {
        <button type="button" class="dropdown-item" (click.stop)="addDescriptorBtn(node,true)"><i
          class="me-1 fa fa-pencil"></i>{{'AbpUi::Edit' | abpLocalization}}</button>
        <button type="button" class="dropdown-item" (click.stop)="deleteDescriptorBtn(node)"><i
          class=" me-1 fa fa-remove"></i>{{'AbpUi::Delete' | abpLocalization}}</button>
      }
    </ng-template>

    <ng-template abpTreeNodeTemplate let-node>
      <div class="file-tree-node-drop-target" [class.my-files-node]="isMyFilesNode(node)"
        [class.first-child-of-directory]="node.origin?.isFirstChildOfDirectory">
        <i class="fa me-1" [class.fa-home]="isMyFilesNode(node)" [class.fa-folder]="!isMyFilesNode(node)"
          aria-hidden="true" (click)="$event.stopPropagation()"></i>
        <span>{{node.title}}</span>
      </div>
    </ng-template>

    <ng-template abpTreeExpandedIconTemplate let-node let-origin="origin">
      @if (node.children.length>0 && !isMyFilesNode(node)) {
        <i aria-hidden="true">
          <ng-container *ngTemplateOutlet="node.isExpanded ? minusIcon : plusIcon"></ng-container></i>
        }
      </ng-template>

      <ng-template #minusIcon>
        <i class="fa fa-minus" aria-hidden="true"></i>
      </ng-template>

        <ng-template #plusIcon>
          <i class="fa fa-plus" aria-hidden="true"></i>
        </ng-template>
  </abp-tree>
</div>
      <abp-modal [(visible)]="ModalDescriptorOpen" [busy]="ModalDescriptorBusy"
        (visibleChange)="ModalDescriptorVisibleChange($event)">
        <ng-template #abpHeader>
          <h3>{{theNodeBeingEdited?('AbpUi::Edit' | abpLocalization):('FileExplorer::NewDirectory' | abpLocalization)}}
          </h3>
        </ng-template>
        <ng-template #abpBody>
          @if (ModalDescriptorForm) {
            <form class="sites-modal-form" #myForm="ngForm" [formGroup]="ModalDescriptorForm"
              (keydown.enter)="$event.preventDefault()" (submit)="createOrEditSave()">
              <button type="submit" #ModalFormDescriptorSubmit style="display: none"></button>
              <div class="mb-3">
                <label class="form-label">{{'FileExplorer::DirectoryName' | abpLocalization}}</label>
                <input type="text" class="form-control" formControlName="name">
              </div>
            </form>
          } @else {
            <div class="text-center"><i class="fa fa-pulse fa-spinner" aria-hidden="true"></i></div>
          }
        </ng-template>
        <ng-template #abpFooter>
          <button type="button" class="btn btn-secondary" abpClose>{{'AbpUi::Close' | abpLocalization}}</button>
          <abp-button iconClass="fa fa-check" [loading]="ModalDescriptorBusy"
          (click)="ModalFormDescriptorSubmit.nativeElement.click()">{{'AbpUi::Save' | abpLocalization}}</abp-button>
        </ng-template>
      </abp-modal>
