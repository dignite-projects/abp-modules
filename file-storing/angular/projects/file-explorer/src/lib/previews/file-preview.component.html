<div class="image_box" [style]="{ width: width, maxWidth: '100%' }">
  <a class="file-preview-link" [href]="src" [download]="name" [attr.aria-label]="name">
    @if (isImage) {
      <div class="img_box" [class]="className">
        <img [src]="displaySrc" [alt]="name" />
      </div>
    }
    @if (isAudio) {
      <i class="file-type-icon fa fa-file-audio-o fs-4" aria-hidden="true"></i>
    }
    @if (isVideo) {
      <i class="file-type-icon fa fa-file-video-o fs-4" aria-hidden="true"></i>
    }
    @if (!(isImage||isAudio||isVideo)) {
      <i class="file-type-icon fs-4" [ngClass]="getFileIconClass()" aria-hidden="true"></i>
    }
  </a>
</div>
