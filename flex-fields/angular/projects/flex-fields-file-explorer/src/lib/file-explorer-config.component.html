<form [formGroup]="formEntity">
  <div formGroupName="configuration">
    <div class="mb-3">
      <label class="form-label">
        {{ 'FlexFieldsFileExplorer::FieldType:FileExplorer:FileContainerName' | abpLocalization }}
      </label>
      <input type="text" class="form-control" formControlName="FileExplorer.FileContainerName" />
    </div>
    <div class="mb-3">
      <div class="form-check form-check-inline">
        <input
          class="form-check-input"
          type="checkbox"
          formControlName="FileExplorer.UploadFileMultiple"
          id="fileExplorerUploadFileMultiple"
        />
        <label class="form-check-label" for="fileExplorerUploadFileMultiple">
          {{ 'FlexFieldsFileExplorer::FieldType:FileExplorer:UploadFileMultiple' | abpLocalization }}
        </label>
      </div>
    </div>
    <button type="submit" style="display: none" #submitclick></button>
  </div>
</form>
