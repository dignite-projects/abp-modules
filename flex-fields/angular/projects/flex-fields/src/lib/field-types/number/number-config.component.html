<form [formGroup]="formEntity">
  <div formGroupName="configuration">
    <div class="mb-3">
      <label class="form-label">{{ 'FlexFields::Placeholder' | abpLocalization }}</label>
      <input type="text" class="form-control" formControlName="Number.Placeholder" />
    </div>
    <div class="mb-3">
      <label class="form-label">{{ 'FlexFields::Min' | abpLocalization }}</label>
      <input type="text" class="form-control" formControlName="Number.Min" />
    </div>
    <div class="mb-3">
      <label class="form-label">{{ 'FlexFields::Max' | abpLocalization }}</label>
      <input type="text" class="form-control" formControlName="Number.Max" />
    </div>
    <div class="mb-3">
      <label class="form-label">{{ 'FlexFields::NumberDecimals' | abpLocalization }}</label>
      <input type="text" class="form-control" formControlName="Number.Decimals" />
    </div>
    <div class="mb-3">
      <label class="form-label">{{ 'FlexFields::NumberStep' | abpLocalization }}</label>
      <input type="text" class="form-control" formControlName="Number.Step" />
      <small class="form-text text-muted d-block">
        {{ 'FlexFields::NumberStepHelp' | abpLocalization }}
      </small>
    </div>
    <div class="mb-3">
      <label class="form-label">{{ 'FlexFields::FormatSpecifier' | abpLocalization }}</label>
      <input type="text" class="form-control" formControlName="FormatSpecifier" />
      <small class="form-text text-muted d-block">
        <a [href]="formatSpecifierDocsUrl" target="_blank" rel="noopener">
          {{ formatSpecifierDocsUrl }}
        </a>
      </small>
    </div>
    <button type="submit" style="display: none" #submitclick></button>
  </div>
</form>
