<form [formGroup]="entityForm">
  <div [formGroupName]="parentField">
    <div class="mb-3">
      <label class="form-label" *ngIf="fieldValue.field.displayName">
        {{ fieldValue.field.displayName }}
      </label>
      <input
        type="number"
        class="form-control"
        [formControlName]="fieldValue.field.name"
        [placeholder]="configuration['NumericEditField.Placeholder'] || ''"
        [step]="configuration['NumericEditField.Step']"
        [min]="configuration['NumericEditField.Min']"
        [max]="configuration['NumericEditField.Max']"
        (input)="onInput($event)"
      />
      <small class="form-text text-muted d-block" *ngIf="fieldValue.field.description">
        {{ fieldValue.field.description }}
      </small>
    </div>
  </div>
  <button type="submit" style="display: none" #submitclick></button>
</form>
