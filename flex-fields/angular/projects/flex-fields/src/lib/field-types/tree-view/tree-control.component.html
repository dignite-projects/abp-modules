<div [formGroup]="entityForm">
  <div [formGroupName]="parentField">
    <div class="mb-3">
      <label class="form-label" *ngIf="fieldValue.field.displayName">
        {{ fieldValue.field.displayName }}
      </label>
      <button
        *ngIf="selectedKeys.length > 0"
        type="button"
        class="btn btn-link btn-sm p-0 ms-2"
        (click)="clearSelection()"
      >
        <i class="fa fa-times" aria-hidden="true"></i>
      </button>
      <div
        class="ff-tree-picker form-control h-auto"
        [class.is-invalid]="fieldControl?.invalid && fieldControl?.touched"
        [attr.data-flex-field-name]="fieldValue.field.name"
      >
        @if (nodes.length > 0) {
          <abp-tree
            [nodes]="nodes"
            [checkable]="false"
            [expandedKeys]="expandedKeys"
            [isNodeSelected]="isNodeSelected"
            (nzExpandChange)="onExpandChange($event)"
            (selectedNodeChange)="onTreeNodeChange($event)"
          >
            <ng-template abpTreeNodeTemplate let-node>
              <div
                class="d-inline-flex align-items-center ff-tree-picker-node"
                [class.ff-tree-picker-node-selected]="isNodeActive(node)"
                (click)="toggleSelected($event, node)"
              >
                <input
                  *ngIf="multiple"
                  type="checkbox"
                  class="form-check-input me-2"
                  [checked]="isNodeChecked(node)"
                  [indeterminate]="isIndeterminate(node)"
                  [attr.data-indeterminate]="isIndeterminate(node)"
                />
                <span>{{ node.title }}</span>
              </div>
            </ng-template>
          </abp-tree>
        }
      </div>
      <small class="form-text text-muted d-block" *ngIf="fieldValue.field.description">
        {{ fieldValue.field.description }}
      </small>
    </div>
  </div>
</div>
