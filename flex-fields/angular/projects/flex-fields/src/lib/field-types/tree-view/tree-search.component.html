<div [formGroup]="entityForm">
  <div [formGroupName]="parentField">
    <div class="mb-3">
      <label class="form-label" *ngIf="fieldValue.field.displayName">
        {{ fieldValue.field.displayName }}
      </label>
      <select
        class="form-select"
        [attr.data-flex-field-name]="fieldValue.field.name"
        [multiple]="multiple"
        [attr.size]="multiple ? 5 : null"
        [formControlName]="fieldValue.field.name"
      >
        <option *ngIf="!multiple" [ngValue]="null"></option>
        <option *ngFor="let item of options" [value]="item.key">{{ item.label }}</option>
      </select>
    </div>
  </div>
</div>
