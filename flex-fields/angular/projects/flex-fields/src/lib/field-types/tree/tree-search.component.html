<div [formGroup]="entityForm">
  <div [formGroupName]="parentField">
    <div class="mb-3">
      <label class="form-label" *ngIf="fieldValue.field.displayName">
        {{ fieldValue.field.displayName }}
      </label>
      <div class="ff-tree-picker" [attr.data-flex-field-name]="fieldValue.field.name">
        <button
          type="button"
          class="form-select text-start ff-tree-picker-toggle"
          [class.text-muted]="selectedKeys.length === 0"
          [attr.aria-expanded]="isDropdownOpen"
          (click)="toggleDropdown()"
        >
          <span>{{ displayText }}</span>
        </button>
        <button
          *ngIf="selectedKeys.length > 0"
          type="button"
          class="btn btn-link ff-tree-picker-clear"
          (click)="clearSelection($event)"
        >
          <i class="fa fa-times" aria-hidden="true"></i>
        </button>

        @if (isDropdownOpen) {
          <div class="ff-tree-picker-menu">
            <ff-tree-picker-nodes
              [nodes]="nodes"
              [expandedKeys]="expandedKeys"
              [selectedKeys]="selectedKeys"
              [multiple]="multiple"
              (nodeToggle)="toggleSelected($event)"
              (expandChange)="onExpandChange($event)"
            />
          </div>
        }
      </div>
    </div>
  </div>
</div>
