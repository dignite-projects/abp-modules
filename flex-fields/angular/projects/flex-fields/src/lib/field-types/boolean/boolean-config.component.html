<form [formGroup]="formEntity">
  <div formGroupName="configuration">
    <div class="mb-3">
      <div class="form-check form-check-inline">
        <input
          class="form-check-input"
          type="checkbox"
          formControlName="Boolean.Default"
          [id]="defaultValueId"
        />
        <label class="form-check-label" [for]="defaultValueId">
          {{ 'FlexFields::DefaultValue' | abpLocalization }}
        </label>
      </div>
    </div>
    <button type="submit" style="display: none" #submitclick></button>
  </div>
</form>
