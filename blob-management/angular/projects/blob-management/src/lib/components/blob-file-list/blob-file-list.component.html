<div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
  <input
    type="search"
    class="form-control flex-grow-1"
    style="max-width: 20rem"
    [placeholder]="'BlobManagement::SearchFiles' | abpLocalization"
    (keyup.enter)="search($any($event.target).value)"
    (search)="search($any($event.target).value)"
  />
</div>

<ngx-datatable
  class="material"
  [rows]="data().items"
  [count]="data().totalCount"
  [list]="list"
  [externalPaging]="true"
  [externalSorting]="true"
  columnMode="flex"
  [headerHeight]="45"
  [footerHeight]="45"
  rowHeight="auto"
  [messages]="{ emptyMessage: ('BlobManagement::NoFiles' | abpLocalization) }"
>
  <ngx-datatable-column [name]="'BlobManagement::Name' | abpLocalization" prop="name" [flexGrow]="4">
    <ng-template let-row="row" ngx-datatable-cell-template>
      <div class="d-flex align-items-center gap-2">
        <blob-file-preview [src]="row.url" [mimeType]="row.mimeType" [name]="row.name" [pixels]="32" />
        <span class="text-break">{{ row.name }}</span>
      </div>
    </ng-template>
  </ngx-datatable-column>
  <ngx-datatable-column [name]="'BlobManagement::Size' | abpLocalization" prop="size" [flexGrow]="1">
    <ng-template let-value="value" ngx-datatable-cell-template>{{ value | blobFileSize }}</ng-template>
  </ngx-datatable-column>
  <ngx-datatable-column [name]="'BlobManagement::CreationTime' | abpLocalization" prop="creationTime" [flexGrow]="1.5">
    <ng-template let-value="value" ngx-datatable-cell-template>{{ value | date: 'short' }}</ng-template>
  </ngx-datatable-column>
  <ngx-datatable-column name="" [sortable]="false" [flexGrow]="0.6">
    <ng-template let-row="row" ngx-datatable-cell-template>
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        [attr.aria-label]="'BlobManagement::Download' | abpLocalization"
        [title]="'BlobManagement::Download' | abpLocalization"
        (click)="download(row)"
      >
        <i class="fa fa-download" aria-hidden="true"></i>
      </button>
    </ng-template>
  </ngx-datatable-column>
</ngx-datatable>
