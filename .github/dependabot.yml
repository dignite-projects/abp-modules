version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    groups:
      abp:
        patterns:
          - "Volo.Abp.*"
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      others:
        patterns:
          - "*"
    ignore:
      - dependency-name: "Volo.Abp.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: nuget
    directory: "/file-storing/host/Dignite.FileExplorer.Web.Host"
    schedule:
      interval: monthly
    groups:
      abp:
        patterns:
          - "Volo.Abp.*"
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      others:
        patterns:
          - "*"
    ignore:
      - dependency-name: "Volo.Abp.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "Volo.Abp.Studio.Client.AspNetCore"
        versions: [">= 3.0.9"]
      - dependency-name: "Microsoft.OpenApi"
        versions: [">= 3.0.0"]

  - package-ecosystem: nuget
    directory: "/notifications/host/Dignite.NotificationCenter.Web.Host"
    schedule:
      interval: monthly
    groups:
      abp:
        patterns:
          - "Volo.Abp.*"
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      others:
        patterns:
          - "*"
    ignore:
      - dependency-name: "Volo.Abp.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "Volo.Abp.Studio.Client.AspNetCore"
        versions: [">= 3.0.9"]
      - dependency-name: "Microsoft.OpenApi"
        versions: [">= 3.0.0"]

  - package-ecosystem: nuget
    directory: "/flex-fields/demo/Dignite.Abp.FlexFields.Demo"
    schedule:
      interval: monthly
    groups:
      abp:
        patterns:
          - "Volo.Abp.*"
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      others:
        patterns:
          - "*"
    ignore:
      - dependency-name: "Volo.Abp.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "Volo.Abp.Studio.Client.AspNetCore"
        versions: [">= 3.0.9"]
      - dependency-name: "Microsoft.OpenApi"
        versions: [">= 3.0.0"]

  - package-ecosystem: npm
    directory: "/file-storing/angular"
    schedule:
      interval: monthly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
      abp-ng:
        patterns:
          - "@abp/ng.*"
      others:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@abp/ng.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/notifications/angular"
    schedule:
      interval: monthly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
      abp-ng:
        patterns:
          - "@abp/ng.*"
      others:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@abp/ng.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/flex-fields/angular"
    schedule:
      interval: monthly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
      abp-ng:
        patterns:
          - "@abp/ng.*"
      others:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@abp/ng.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]
