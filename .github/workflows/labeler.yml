name: Labeler

# Applies the path-based labels defined in .github/labeler.yml to every pull request.
#
# pull_request_target (not pull_request) is used so PRs opened from forks still run with the
# pull-requests:write permission needed to apply labels. This is safe here because actions/labeler
# only reads the PR's changed-file list via the API and applies labels - it never checks out or
# executes any code from the pull request.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
