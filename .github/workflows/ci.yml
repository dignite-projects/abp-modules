name: CI

# `build-and-test` is a required status check on main (with enforce_admins), so the pull_request
# trigger must not filter by path: a docs-only PR would never start this workflow, the check would
# never report, and the PR could never be merged by anyone. The push trigger is informational and
# keeps its filter.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.claude/**'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            file-storing/angular/package-lock.json
            notifications/angular/package-lock.json
            flex-fields/angular/package-lock.json

      - name: Verify NuGet and npm version lockstep
        id: version
        shell: pwsh
        run: |
          $version = & ./.github/scripts/verify-version-lockstep.ps1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Dignite.Abp.Modules.slnx

      # Mirrors the release gate so new high/critical vulnerabilities surface on the PR that
      # introduces them instead of only at release time. Keep the allowlist in sync with
      # release.yml.
      - name: Block vulnerable NuGet dependencies
        shell: bash
        run: |
          set -o pipefail
          report="$(dotnet list Dignite.Abp.Modules.slnx package --vulnerable --include-transitive)"
          printf '%s\n' "$report"
          # Known-accepted advisories, allowlisted with a reason (keep in sync with release.yml).
          # Re-run `dotnet list ... --vulnerable --include-transitive` periodically and drop an
          # entry once its package is genuinely fixed or remediated (see SECURITY.md).
          #   - GHSA-7jvp-hj45-2f2m (Scriban, via notifications' Emailing/Emailing.Identity - both
          #     published packages): mass-assignment / access-modifier bypass in
          #     TypedObjectAccessor. No patched version exists upstream as of this writing
          #     (checked 7.2.1 through the latest 7.2.5).
          filtered="$(printf '%s\n' "$report" | grep -Ev 'GHSA-7jvp-hj45-2f2m')"
          if printf '%s\n' "$filtered" | grep -Eiq '^\s*>\s+[^[:space:]]+\s+[^[:space:]]+\s+(high|critical)\b'; then
            echo "::error::High or critical NuGet vulnerabilities block CI."
            exit 1
          fi

      # Includes both demo hosts (file-storing/host/..., notifications/host/...) - each opts out of
      # central package management on its own (common.props / its own nested Directory.Build.props)
      # and pins its own inline package versions.
      - name: Build
        run: dotnet build Dignite.Abp.Modules.slnx --no-restore --configuration Release

      # --- file-storing tests ---
      # Coverage from every file-storing test project below lands under coverage/file-storing so it
      # can be uploaded to Codecov under its own "file-storing" flag (see the upload step after the
      # notifications tests).
      - name: Run FileStoring (core) tests
        run: dotnet test file-storing/core/test/Dignite.Abp.FileStoring.Tests/Dignite.Abp.FileStoring.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/file-storing

      - name: Run FileStoring Imaging (core) tests
        run: dotnet test file-storing/core/test/Dignite.Abp.FileStoring.Imaging.Tests/Dignite.Abp.FileStoring.Imaging.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/file-storing

      # Dignite.FileExplorer.TestBase is shared test infrastructure (no runner) - it is exercised
      # indirectly via the projects below, never run directly.
      - name: Run FileExplorer (domain) tests
        run: dotnet test file-storing/file-explorer/test/Dignite.FileExplorer.Domain.Tests/Dignite.FileExplorer.Domain.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/file-storing

      - name: Run FileExplorer (EF Core) tests
        run: dotnet test file-storing/file-explorer/test/Dignite.FileExplorer.EntityFrameworkCore.Tests/Dignite.FileExplorer.EntityFrameworkCore.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/file-storing

      # MongoDB provider - starts an embedded mongod via MongoSandbox (MongoSandbox8.runtime.linux-x64
      # is pinned in Directory.Packages.props and resolves fine on this runner); no external
      # MongoDB install needed.
      - name: Run FileExplorer (MongoDB) tests
        run: dotnet test file-storing/file-explorer/test/Dignite.FileExplorer.MongoDB.Tests/Dignite.FileExplorer.MongoDB.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/file-storing

      - name: Run FileExplorer (application) tests
        run: dotnet test file-storing/file-explorer/test/Dignite.FileExplorer.Application.Tests/Dignite.FileExplorer.Application.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/file-storing

      - name: Run authorization denial tests
        run: dotnet test file-storing/file-explorer/test/Dignite.FileExplorer.Authorization.Tests/Dignite.FileExplorer.Authorization.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/file-storing

      - name: Run directory safety tests
        run: dotnet test file-storing/file-explorer/test/Dignite.FileExplorer.DirectorySafety.Tests/Dignite.FileExplorer.DirectorySafety.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/file-storing

      - name: Run update authorization tests
        run: dotnet test file-storing/file-explorer/test/Dignite.FileExplorer.Update.Tests/Dignite.FileExplorer.Update.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/file-storing

      # --- notifications tests ---
      # Dignite.NotificationCenter.TestBase is IsTestProject=false (shared scenarios, no runner) -
      # it is exercised indirectly via the two projects below, never run directly. Coverage lands
      # under coverage/notifications, uploaded under its own "notifications" flag below.
      - name: Run Notifications (core) tests
        run: dotnet test notifications/core/test/Dignite.Abp.Notifications.Tests/Dignite.Abp.Notifications.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/notifications

      - name: Run NotificationCenter (EF Core) tests
        run: dotnet test notifications/notification-center/test/Dignite.NotificationCenter.EntityFrameworkCore.Tests/Dignite.NotificationCenter.EntityFrameworkCore.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/notifications

      - name: Run NotificationCenter (MongoDB) tests
        run: dotnet test notifications/notification-center/test/Dignite.NotificationCenter.MongoDB.Tests/Dignite.NotificationCenter.MongoDB.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/notifications

      # Upload each module's coverage under its own flag, so Codecov tracks file-storing and
      # notifications coverage separately instead of blending them into one number (the two module
      # trees are otherwise-unrelated per CLAUDE.md, so a blended number would hide which one
      # regressed). Guarded two ways so a Codecov outage or a missing CODECOV_TOKEN can never fail
      # this required check: continue-on-error on the step and fail_ci_if_error: false on the action.
      # Set the CODECOV_TOKEN repo secret to enable uploads (public-repo tokenless uploads also work
      # but are rate-limited); until then these are no-ops. Flag defaults are in codecov.yml.
      - name: Upload file-storing coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          directory: ./artifacts-ci/coverage/file-storing
          flags: file-storing
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload notifications coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          directory: ./artifacts-ci/coverage/notifications
          flags: notifications
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # Projects with IsPackable=false (both demo hosts + test projects) are skipped automatically.
      # Only the 10 file-storing + 15 notifications packable projects are produced.
      - name: Pack NuGet packages
        run: dotnet pack Dignite.Abp.Modules.slnx --no-build --configuration Release --output ./artifacts-ci/nuget

      - name: Smoke-test file-storing NuGet packages
        shell: pwsh
        run: ./file-storing/.github/scripts/smoke-test-nuget-packages.ps1 ./artifacts-ci/nuget '${{ steps.version.outputs.version }}'

      - name: Smoke-test notifications NuGet packages
        shell: pwsh
        run: ./notifications/.github/scripts/smoke-test-nuget-packages.ps1 ./artifacts-ci/nuget '${{ steps.version.outputs.version }}'

      # --- file-storing Angular (angular/projects/file-explorer) ---
      - name: Install file-storing Angular dependencies
        working-directory: file-storing/angular
        run: npm ci --legacy-peer-deps

      - name: Lint file-storing Angular projects
        working-directory: file-storing/angular
        run: npm run lint -- --max-warnings=0

      - name: Run file-storing Angular unit tests
        working-directory: file-storing/angular
        run: npm test -- --watch=false

      - name: Build file-storing Angular library
        working-directory: file-storing/angular
        run: npm run build:lib

      - name: Build file-storing Angular demo
        working-directory: file-storing/angular
        run: npm run build:prod

      - name: Pack file-storing Angular library
        shell: pwsh
        working-directory: file-storing/angular
        run: |
          New-Item -ItemType Directory -Force ../../artifacts-ci/npm/file-storing | Out-Null
          npm pack ./dist/file-explorer --pack-destination ../../artifacts-ci/npm/file-storing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test file-storing Angular package
        shell: pwsh
        run: |
          $tarballs = @(Get-ChildItem ./artifacts-ci/npm/file-storing/*.tgz)
          if ($tarballs.Count -ne 1) {
            throw "Expected one file-explorer Angular package tarball, found $($tarballs.Count)."
          }
          node ./file-storing/.github/scripts/smoke-test-angular-package.mjs $tarballs[0].FullName '${{ steps.version.outputs.version }}'

      # --- notifications Angular (angular/projects/notification-center) ---
      - name: Install notifications Angular dependencies
        working-directory: notifications/angular
        run: npm ci

      - name: Build notifications Angular library
        working-directory: notifications/angular
        run: npm run build:lib

      - name: Build notifications Angular demo
        working-directory: notifications/angular
        run: npm run build:prod

      - name: Pack notifications Angular library
        shell: pwsh
        working-directory: notifications/angular
        run: |
          New-Item -ItemType Directory -Force ../../artifacts-ci/npm/notifications | Out-Null
          npm pack ./dist/notification-center --pack-destination ../../artifacts-ci/npm/notifications
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test notifications Angular package
        shell: pwsh
        run: |
          $tarballs = @(Get-ChildItem ./artifacts-ci/npm/notifications/*.tgz)
          if ($tarballs.Count -ne 1) {
            throw "Expected one notification-center Angular package tarball, found $($tarballs.Count)."
          }
          node ./notifications/.github/scripts/smoke-test-angular-package.mjs $tarballs[0].FullName '${{ steps.version.outputs.version }}'

      # --- flex-fields Angular (angular/projects/flex-fields) ---
      # --legacy-peer-deps for the same reason as file-storing: @abp/ng.theme.shared depends on
      # @swimlane/ngx-datatable, whose Angular peer range stops at 20, so npm will not hoist it beside
      # Angular 21 without this - and the demo app's global styles import it by top-level path.
      - name: Install flex-fields Angular dependencies
        working-directory: flex-fields/angular
        run: npm ci --legacy-peer-deps

      - name: Lint flex-fields Angular projects
        working-directory: flex-fields/angular
        run: npm run lint -- --max-warnings=0

      - name: Run flex-fields Angular unit tests
        working-directory: flex-fields/angular
        run: npm test -- --watch=false

      - name: Build flex-fields Angular library
        working-directory: flex-fields/angular
        run: npm run build:lib

      - name: Build flex-fields Angular demo
        working-directory: flex-fields/angular
        run: npm run build:prod

      - name: Pack flex-fields Angular library
        shell: pwsh
        working-directory: flex-fields/angular
        run: |
          New-Item -ItemType Directory -Force ../../artifacts-ci/npm/flex-fields | Out-Null
          npm pack ./dist/flex-fields --pack-destination ../../artifacts-ci/npm/flex-fields
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test flex-fields Angular package
        shell: pwsh
        run: |
          $tarballs = @(Get-ChildItem ./artifacts-ci/npm/flex-fields/*.tgz)
          if ($tarballs.Count -ne 1) {
            throw "Expected one flex-fields Angular package tarball, found $($tarballs.Count)."
          }
          node ./flex-fields/.github/scripts/smoke-test-angular-package.mjs $tarballs[0].FullName '${{ steps.version.outputs.version }}'
