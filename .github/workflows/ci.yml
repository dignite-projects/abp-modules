name: CI

# `build-and-test` is a required status check on main (with enforce_admins), so the pull_request
# trigger must not filter by path: a docs-only PR would never start this workflow, the check would
# never report, and the PR could never be merged by anyone. The push trigger is informational and
# keeps its filter.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.claude/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          cache-dependency-path: |
            notifications/angular/yarn.lock
            flex-fields/angular/yarn.lock

      - name: Verify NuGet and npm version lockstep
        id: version
        shell: pwsh
        run: |
          $version = & ./.github/scripts/verify-version-lockstep.ps1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Dignite.Abp.Modules.slnx

      # Mirrors the release gate so new high/critical vulnerabilities surface on the PR that
      # introduces them instead of only at release time. Keep the allowlist in sync with
      # release.yml.
      - name: Block vulnerable NuGet dependencies
        shell: bash
        run: |
          set -o pipefail
          report="$(dotnet list Dignite.Abp.Modules.slnx package --vulnerable --include-transitive)"
          printf '%s\n' "$report"
          # Known-accepted advisories, allowlisted with a reason (keep in sync with release.yml).
          # Re-run `dotnet list ... --vulnerable --include-transitive` periodically and drop an
          # entry once its package is genuinely fixed or remediated (see SECURITY.md). To accept one,
          # filter it out here (`| grep -Ev 'GHSA-...'`) with a comment saying why.
          # None at the moment: the last one, GHSA-7jvp-hj45-2f2m (Scriban), is fixed in 7.2.2 and
          # ABP 10.7.0 resolves Scriban 7.2.5.
          filtered="$report"
          if printf '%s\n' "$filtered" | grep -Eiq '^\s*>\s+[^[:space:]]+\s+[^[:space:]]+\s+(high|critical)\b'; then
            echo "::error::High or critical NuGet vulnerabilities block CI."
            exit 1
          fi

      # Includes both demo hosts (notifications/host/..., flex-fields/demo/...) - each opts out of
      # central package management on its own (common.props / its own nested Directory.Build.props)
      # and pins its own inline package versions.
      - name: Build
        run: dotnet build Dignite.Abp.Modules.slnx --no-restore --configuration Release

      # --- aspnetcore-mcp tests ---
      # The shared MCP server module. Its tests boot a real host and drive /mcp with the SDK's own client.
      - name: Run AspNetCore Mcp tests
        run: dotnet test aspnetcore-mcp/test/Dignite.Abp.AspNetCore.Mcp.Tests/Dignite.Abp.AspNetCore.Mcp.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/aspnetcore-mcp

      # --- file-storing tests ---
      # Coverage from every file-storing test project below lands under coverage/file-storing so it
      # can be uploaded to Codecov under its own "file-storing" flag (see the upload step after the
      # notifications tests).
      - name: Run FileStoring (core) tests
        run: dotnet test file-storing/core/test/Dignite.Abp.FileStoring.Tests/Dignite.Abp.FileStoring.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/file-storing

      - name: Run FileStoring Imaging (core) tests
        run: dotnet test file-storing/core/test/Dignite.Abp.FileStoring.Imaging.Tests/Dignite.Abp.FileStoring.Imaging.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/file-storing

      # --- notifications tests ---
      # Dignite.Abp.Notifications.Domain.TestBase and Dignite.NotificationCenter.TestBase are
      # IsTestProject=false (shared scenarios, no runner) - each is exercised indirectly via its EF Core
      # and MongoDB projects below, never run directly. The MongoDB projects start an embedded mongod
      # via MongoSandbox. Coverage lands under coverage/notifications, uploaded under its own
      # "notifications" flag below.
      - name: Run Notifications (core) tests
        run: dotnet test notifications/core/test/Dignite.Abp.Notifications.Tests/Dignite.Abp.Notifications.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/notifications

      - name: Run Notifications definition store (EF Core) tests
        run: dotnet test notifications/core/test/Dignite.Abp.Notifications.EntityFrameworkCore.Tests/Dignite.Abp.Notifications.EntityFrameworkCore.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/notifications

      - name: Run Notifications definition store (MongoDB) tests
        run: dotnet test notifications/core/test/Dignite.Abp.Notifications.MongoDB.Tests/Dignite.Abp.Notifications.MongoDB.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/notifications

      - name: Run NotificationCenter (EF Core) tests
        run: dotnet test notifications/notification-center/test/Dignite.NotificationCenter.EntityFrameworkCore.Tests/Dignite.NotificationCenter.EntityFrameworkCore.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/notifications

      - name: Run NotificationCenter (MongoDB) tests
        run: dotnet test notifications/notification-center/test/Dignite.NotificationCenter.MongoDB.Tests/Dignite.NotificationCenter.MongoDB.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/notifications

      # --- flex-fields tests ---
      - name: Run FlexFields (core) tests
        run: dotnet test flex-fields/test/Dignite.Abp.FlexFields.Tests/Dignite.Abp.FlexFields.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/flex-fields

      - name: Run FlexFields (EF Core) tests
        run: dotnet test flex-fields/test/Dignite.Abp.FlexFields.EntityFrameworkCore.Tests/Dignite.Abp.FlexFields.EntityFrameworkCore.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/flex-fields

      - name: Run FlexFields (MongoDB) tests
        run: dotnet test flex-fields/test/Dignite.Abp.FlexFields.MongoDB.Tests/Dignite.Abp.FlexFields.MongoDB.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./artifacts-ci/coverage/flex-fields

      # Coverage is uploaded to Codecov from the separate upload-coverage job below, not here:
      # codecov-action's upload latency is dominated by Codecov's own service (observed anywhere from
      # 2s to 4.5min per call, most likely tokenless-upload rate limiting - see the comment on that
      # job), and build-and-test is the required status check every PR waits on. Hand the coverage
      # files off as an artifact instead of paying that latency on the blocking path.
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: ./artifacts-ci/coverage
          if-no-files-found: error

      # Projects with IsPackable=false (both demo hosts + test projects) are skipped automatically.
      # Every packable project in the aggregate solution is produced - deliberately not counted here, a
      # number in this comment had already drifted (it said 33 while 38 were being packed).
      - name: Pack NuGet packages
        run: dotnet pack Dignite.Abp.Modules.slnx --no-build --configuration Release --output ./artifacts-ci/nuget

      - name: Smoke-test file-storing NuGet packages
        shell: pwsh
        run: ./file-storing/.github/scripts/smoke-test-nuget-packages.ps1 ./artifacts-ci/nuget '${{ steps.version.outputs.version }}'

      - name: Smoke-test notifications NuGet packages
        shell: pwsh
        run: ./notifications/.github/scripts/smoke-test-nuget-packages.ps1 ./artifacts-ci/nuget '${{ steps.version.outputs.version }}'

      - name: Smoke-test flex-fields NuGet packages
        shell: pwsh
        run: ./flex-fields/.github/scripts/smoke-test-nuget-packages.ps1 ./artifacts-ci/nuget '${{ steps.version.outputs.version }}'

      - name: Smoke-test aspnetcore-mcp NuGet packages
        shell: pwsh
        run: ./aspnetcore-mcp/.github/scripts/smoke-test-nuget-packages.ps1 ./artifacts-ci/nuget '${{ steps.version.outputs.version }}'

      # --- notifications Angular (angular/projects/notification-center) ---
      - name: Install notifications Angular dependencies
        working-directory: notifications/angular
        run: yarn install --frozen-lockfile

      # This workspace declares neither package itself, but depends on @abp/ng.components, which
      # pulls both in transitively - see build/check-angular-package-duplicates.mjs.
      - name: Check notifications Angular package duplicates
        run: node ./build/check-angular-package-duplicates.mjs notifications/angular/node_modules ng-zorro-antd @angular/cdk

      - name: Lint notifications Angular projects
        working-directory: notifications/angular
        run: yarn lint --max-warnings=0

      - name: Run notifications Angular unit tests
        working-directory: notifications/angular
        run: yarn test --watch=false

      - name: Build notifications Angular library
        working-directory: notifications/angular
        run: yarn build:lib

      # ng-packagr emits an external for every bare specifier it does not bundle, but never checks
      # that the external is declared - a library can publish a bundle importing a package its own
      # package.json does not name, and nothing fails until a consumer builds. The smoke test below
      # cannot see it: it seeds the throwaway consumer from the demo app's dependency list, so the
      # undeclared package is already installed.
      - name: Check notifications Angular package dependencies
        run: node ./build/check-angular-package-deps.mjs notifications/angular/dist/notification-center

      - name: Build notifications Angular demo
        working-directory: notifications/angular
        run: yarn build:prod

      - name: Pack notifications Angular library
        shell: pwsh
        working-directory: notifications/angular
        run: |
          New-Item -ItemType Directory -Force ../../artifacts-ci/npm/notifications | Out-Null
          npm pack ./dist/notification-center --pack-destination ../../artifacts-ci/npm/notifications
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test notifications Angular package
        shell: pwsh
        run: |
          $tarballs = @(Get-ChildItem ./artifacts-ci/npm/notifications/*.tgz)
          if ($tarballs.Count -ne 1) {
            throw "Expected one notification-center Angular package tarball, found $($tarballs.Count)."
          }
          node ./notifications/.github/scripts/smoke-test-angular-package.mjs $tarballs[0].FullName '${{ steps.version.outputs.version }}'

      # --- flex-fields Angular (angular/projects/flex-fields) ---
      # Expect unmet-peer warnings from this install: @abp/ng.theme.shared depends on
      # @swimlane/ngx-datatable, whose Angular peer range stops at 20, and the demo app's global styles
      # import it by top-level path. yarn reports that as a warning rather than an error, which is why
      # npm's --legacy-peer-deps workaround is no longer needed here.
      - name: Install flex-fields Angular dependencies
        working-directory: flex-fields/angular
        run: yarn install --frozen-lockfile

      # @abp/ng.components pins ng-zorro-antd at <21.1.0 while this demo app used to ask for
      # ^21.3.3 (narrowed to ~21.0.2 for exactly this reason); @angular/cdk reaches the same
      # package by the same route and carries the same risk. Two copies are two module-scoped
      # NZ_CONFIG/NzConfigService tokens - see build/check-angular-package-duplicates.mjs.
      - name: Check flex-fields Angular package duplicates
        run: node ./build/check-angular-package-duplicates.mjs flex-fields/angular/node_modules ng-zorro-antd @angular/cdk

      - name: Lint flex-fields Angular projects
        working-directory: flex-fields/angular
        run: yarn lint --max-warnings=0

      - name: Run flex-fields Angular unit tests
        working-directory: flex-fields/angular
        run: yarn test --watch=false

      - name: Build flex-fields Angular library
        working-directory: flex-fields/angular
        run: yarn build:lib

      - name: Check flex-fields Angular package dependencies
        run: node ./build/check-angular-package-deps.mjs flex-fields/angular/dist/flex-fields

      # Built here only since 10.0.0-rc.12: release.yml has always built and published it, but ci.yml
      # never did, so a PR breaking the ckeditor adapter stayed green until tag time.
      - name: Build flex-fields-ckeditor Angular library
        working-directory: flex-fields/angular
        run: yarn build:lib:ckeditor

      - name: Check flex-fields adapters Angular package dependencies
        run: node ./build/check-angular-package-deps.mjs flex-fields/angular/dist/flex-fields-ckeditor

      # `yarn test` above covers the core library only. These specs resolve @dignite/ng.flex-fields from
      # dist/flex-fields (the library's tsconfig.spec.json), so they run after `yarn build:lib`.
      - name: Run flex-fields-ckeditor Angular unit tests
        working-directory: flex-fields/angular
        run: yarn test:ckeditor --watch=false

      - name: Build flex-fields Angular demo
        working-directory: flex-fields/angular
        run: yarn build:prod

      - name: Pack flex-fields Angular library
        shell: pwsh
        working-directory: flex-fields/angular
        run: |
          New-Item -ItemType Directory -Force ../../artifacts-ci/npm/flex-fields | Out-Null
          npm pack ./dist/flex-fields --pack-destination ../../artifacts-ci/npm/flex-fields
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test flex-fields Angular package
        shell: pwsh
        run: |
          $tarballs = @(Get-ChildItem ./artifacts-ci/npm/flex-fields/*.tgz)
          if ($tarballs.Count -ne 1) {
            throw "Expected one flex-fields Angular package tarball, found $($tarballs.Count)."
          }
          node ./flex-fields/.github/scripts/smoke-test-angular-package.mjs $tarballs[0].FullName '${{ steps.version.outputs.version }}'

  # Not a required check: Codecov's upload latency is Codecov's, not ours (observed anywhere from a
  # few seconds to 4+ minutes per module, most likely tokenless-upload rate limiting), and it must
  # never be what a PR is waiting on to merge. Runs after build-and-test succeeds, using the coverage
  # files that job already collected, instead of re-running any tests.
  upload-coverage:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: ./artifacts-ci/coverage

      # Upload each module's coverage under its own flag, so Codecov tracks each module separately
      # instead of blending unrelated code into one number (the module
      # trees are otherwise-unrelated per CLAUDE.md, so a blended number would hide which one
      # regressed). Guarded two ways so a Codecov outage or a missing CODECOV_TOKEN can never fail
      # this job: continue-on-error on the step and fail_ci_if_error: false on the action. Set the
      # CODECOV_TOKEN repo secret to enable uploads (public-repo tokenless uploads also work but are
      # rate-limited); until then these are no-ops. Flag defaults are in codecov.yml.
      - name: Upload file-storing coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          directory: ./artifacts-ci/coverage/file-storing
          flags: file-storing
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload notifications coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          directory: ./artifacts-ci/coverage/notifications
          flags: notifications
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload flex-fields coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          directory: ./artifacts-ci/coverage/flex-fields
          flags: flex-fields
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
