name: 💡 Feature request
description: Suggest an idea or enhancement for one of the Dignite ABP modules
labels: ["enhancement"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Which module?
      options:
        - "file-storing (Dignite.Abp.FileStoring / Dignite.FileExplorer)"
        - "notifications (Dignite.Abp.Notifications / Dignite.NotificationCenter)"
        - "flex-fields (Dignite.Abp.FlexFields / @dignite/ng.flex-fields)"
        - "Repo-wide / not sure"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: A clear and concise description of the problem or use case. "I'm always frustrated when …"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to happen. API sketches or usage examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
